<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        main {
            width: 73%;
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 35px;
        }

        header {
            margin-bottom: 22px;
            font-size: 108px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -6px;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
        }

        
        .title {
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: 500;
            color: #ddd;
        }

        .player {
            width: 100%;
            background: #000;
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        video {
            display: block;
            width: 100%;
            max-height: 70vh;
            background: #000;
        }

        .info {
            margin-top: 15px;
            color: #777;
            font-size: 13px;
        }

        footer {
            padding: 40px;
            text-align: center;
            color: #444;
            font-size: 12px;
        }
        .player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid #222;
    border-radius: 8px;
    overflow: hidden;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

        @media (max-width: 700px) {
            main {
                width: 92%;
                padding-top: 25px;
            }

            header {
                font-size: 60px;
                letter-spacing: -3px;
            }

            header::before {
                font-size: 10px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
