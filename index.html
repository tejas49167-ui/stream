<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TejFlex</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* =========================
           BODY
        ========================= */

        body {
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: 73%;
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 35px;
        }

        /* =========================
           LOGO
        ========================= */

        header {
            display: flex;
            align-items: center;
            gap: 0;

            font-family: Arial, Helvetica, sans-serif;
            font-weight: 900;
            font-size: 82px;
            line-height: 1;

            color: #e50914;
            letter-spacing: -6px;

            margin-bottom: 25px;
        }

        header span {
            display: inline-block;
            transform-origin: center bottom;
        }

        /* T */
        header span:nth-child(1) {
            font-size: 1.12em;
            transform: translateY(8px) rotate(-3deg);
        }

        /* E */
        header span:nth-child(2) {
            font-size: 1.05em;
            transform: translateY(4px) rotate(-2deg);
        }

        /* J */
        header span:nth-child(3) {
            font-size: 0.98em;
            transform: translateY(1px) rotate(-1deg);
        }

        /* F */
        header span:nth-child(4) {
            font-size: 0.95em;
            transform: translateY(0);
        }

        /* L */
        header span:nth-child(5) {
            font-size: 0.98em;
            transform: translateY(1px) rotate(1deg);
        }

        /* E */
        header span:nth-child(6) {
            font-size: 1.05em;
            transform: translateY(4px) rotate(2deg);
        }

        /* X */
        header span:nth-child(7) {
            font-size: 1.12em;
            transform: translateY(8px) rotate(3deg);
        }

        /* =========================
           MOVIE TITLE
        ========================= */

        .title {
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: 500;
            color: #ddd;
        }

        /* =========================
           DESKTOP VIDEO
        ========================= */

        .desktop-player {
            width: 100%;
            aspect-ratio: 16 / 9;

            background: #000;

            border: 1px solid #222;
            border-radius: 8px;

            overflow: hidden;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        .desktop-player iframe {
            width: 100%;
            height: 100%;

            display: block;

            border: 0;
        }

        /* =========================
           MOBILE MESSAGE
        ========================= */

        .mobile-player {
            display: none;
        }

        .mobile-box {
            background: #111;

            border: 1px solid #242424;
            border-radius: 10px;

            padding: 35px 20px;

            text-align: center;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        .mobile-box h2 {
            font-size: 20px;
            font-weight: 600;

            margin-bottom: 12px;
        }

        .mobile-box p {
            color: #888;
            font-size: 14px;
            line-height: 1.5;

            margin-bottom: 25px;
        }

        /* =========================
           GOOGLE DRIVE BUTTON
        ========================= */

        .drive-button {
            display: inline-block;

            background: #e50914;
            color: white;

            text-decoration: none;

            padding: 13px 22px;

            border-radius: 6px;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }

        .drive-button:hover {
            background: #f20d19;
            transform: translateY(-1px);
        }

        .drive-button:active {
            transform: scale(0.98);
        }

        /* =========================
           INFO
        ========================= */

        .info {
            margin-top: 15px;

            color: #777;
            font-size: 13px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 40px;

            text-align: center;

            color: #444;
            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            main {
                width: 94%;
                max-width: none;

                padding-top: 20px;
            }

            /* LOGO */

            header {
                font-size: 52px;
                letter-spacing: -3px;

                margin-bottom: 20px;
            }

            header span:nth-child(1),
            header span:nth-child(7) {
                font-size: 65px;
            }

            header span:nth-child(2),
            header span:nth-child(6) {
                font-size: 59px;
            }

            header span:nth-child(3),
            header span:nth-child(5) {
                font-size: 52px;
            }

            header span:nth-child(4) {
                font-size: 46px;
            }

            /* TITLE */

            .title {
                font-size: 18px;
                margin-bottom: 12px;
            }

            /* HIDE DESKTOP PLAYER */

            .desktop-player {
                display: none;
            }

            /* SHOW MOBILE MESSAGE */

            .mobile-player {
                display: block;
            }

            /* MOBILE BOX */

            .mobile-box {
                padding: 35px 18px;
            }

            .mobile-box h2 {
                font-size: 19px;
            }

            .mobile-box p {
                font-size: 13px;
            }

            /* BUTTON */

            .drive-button {
                width: 100%;
                padding: 14px;

                font-size: 14px;
            }

            /* INFO */

            .info {
                display: none;
            }

            /* FOOTER */

            footer {
                padding: 30px 15px;

                line-height: 1.5;
            }
        }

        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            main {
                width: 96%;
            }

            header {
                font-size: 45px;
                letter-spacing: -3px;
            }

            header span:nth-child(1),
            header span:nth-child(7) {
                font-size: 56px;
            }

            header span:nth-child(2),
            header span:nth-child(6) {
                font-size: 51px;
            }

            header span:nth-child(3),
            header span:nth-child(5) {
                font-size: 45px;
            }

            header span:nth-child(4) {
                font-size: 40px;
            }

            .title {
                font-size: 17px;
            }

            .mobile-box {
                padding: 30px 15px;
            }
        }

    </style>
</head>


<body>

    <main>

        <!-- =========================
             TEJFLEX LOGO
        ========================= -->

        <header>
            <span>T</span>
            <span>E</span>
            <span>J</span>
            <span>F</span>
            <span>L</span>
            <span>E</span>
            <span>X</span>
        </header>

        <h1 class="title">
            Toxic the Movie
        </h1>


        <div class="desktop-player">

            <iframe
                src="https://drive.google.com/file/d/11E_lcWREUJZFwxqkBdduUxiEHFwMz5yQ/preview"
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                allowfullscreen
                title="Toxic the Movie">
            </iframe>

        </div>


    

        <div class="mobile-player">
            <div style="padding:44.444% 0 0 0;position:relative;width:100%;"><iframe style="position:absolute;top:0;left:0;width:100%;height:100%;" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture; web-share" allowfullscreen frameborder="0" referrerpolicy="strict-origin-when-cross-origin" src="https://livid.com/embed/btfj61TXjWhB" title="Toxic : A fairy tale for grown ups"></iframe></div>

            <div class="mobile-box">


                <a
                    class="drive-button"
                    href="https://drive.google.com/file/d/11E_lcWREUJZFwxqkBdduUxiEHFwMz5yQ/view"
                    target="_blank"
                    rel="noopener noreferrer">
                    Watch also on google drive
                </a>

            </div>

        </div>


        <div class="info">
            watch it in google drive by pressing below link 
        </div>

    </main>


    <footer>
        Watch your fav movie, if you want any, msg Tejas -
        tejas49167@gmail.com
    </footer>

</body>

</html>
